<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Upload de lista no Dashboard</title>
  <desc id="desc">Mockup abstrato do Dashboard com área de upload de catálogo</desc>
  <rect width="960" height="360" fill="#f7f7f7"/>
  <rect x="40" y="36" width="880" height="288" rx="8" fill="#fff" stroke="#d9d9d9"/>
  <!-- top bar -->
  <rect x="40" y="36" width="880" height="44" fill="#111"/>
  <text x="64" y="64" font-family="Ubuntu, Segoe UI, sans-serif" font-size="14" fill="#fff">LicitaFit Dashboard</text>
  <rect x="780" y="48" width="110" height="22" rx="3" fill="#0e8420"/>
  <text x="800" y="63" font-family="Ubuntu, Segoe UI, sans-serif" font-size="11" fill="#fff">Catálogo</text>
  <!-- sidebar -->
  <rect x="40" y="80" width="180" height="244" fill="#fafafa"/>
  <rect x="60" y="108" width="140" height="12" rx="2" fill="#d9d9d9"/>
  <rect x="60" y="136" width="120" height="12" rx="2" fill="#e5e5e5"/>
  <rect x="60" y="164" width="130" height="12" rx="2" fill="#e5e5e5"/>
  <rect x="60" y="192" width="100" height="12" rx="2" fill="#e5e5e5"/>
  <!-- upload zone -->
  <rect x="260" y="110" width="600" height="180" rx="6" fill="#f7f7f7" stroke="#d9d9d9" stroke-dasharray="8 6"/>
  <circle cx="560" cy="170" r="28" fill="#fff" stroke="#0e8420" stroke-width="2"/>
  <path d="M560 156 v28 M546 170 h28" stroke="#0e8420" stroke-width="2.5" stroke-linecap="round"/>
  <text x="560" y="226" text-anchor="middle" font-family="Ubuntu, Segoe UI, sans-serif" font-size="14" fill="#111">Enviar lista de produtos</text>
  <text x="560" y="250" text-anchor="middle" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#666">Notebooks e monitores do mix atual</text>
</svg>
