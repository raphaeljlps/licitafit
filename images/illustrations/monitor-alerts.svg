<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Alertas de monitoramento de edital</title>
  <desc id="desc">Diagrama de edital monitorado com alerta de mudança no matching</desc>
  <rect width="960" height="360" fill="#f7f7f7"/>
  <!-- timeline -->
  <line x1="120" y1="180" x2="840" y2="180" stroke="#d9d9d9" stroke-width="3"/>
  <circle cx="200" cy="180" r="14" fill="#0e8420"/>
  <circle cx="480" cy="180" r="14" fill="#24598f"/>
  <circle cx="760" cy="180" r="14" fill="#b76f00"/>
  <!-- cards -->
  <rect x="80" y="56" width="240" height="88" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="100" y="84" font-family="Ubuntu, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#111">Edital publicado</text>
  <text x="100" y="108" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#666">Matching inicial</text>
  <text x="100" y="128" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#0e8420">status registrados</text>
  <rect x="360" y="56" width="240" height="88" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="380" y="84" font-family="Ubuntu, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#111">Monitoramento</text>
  <text x="380" y="108" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#666">Versões revisitadas</text>
  <text x="380" y="128" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#24598f">licitação acompanhada</text>
  <rect x="640" y="56" width="240" height="88" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="660" y="84" font-family="Ubuntu, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#111">Retificação</text>
  <text x="660" y="108" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#666">Impacto no matching</text>
  <text x="660" y="128" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#b76f00">alerta para revisão</text>
  <!-- bottom alert -->
  <rect x="200" y="240" width="560" height="64" rx="6" fill="#fff" stroke="#b76f00" stroke-width="2"/>
  <circle cx="240" cy="272" r="14" fill="#b76f00"/>
  <text x="236" y="277" font-family="Ubuntu, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fff">!</text>
  <text x="270" y="268" font-family="Ubuntu, Segoe UI, sans-serif" font-size="13" fill="#111">Mudança no item monitorado</text>
  <text x="270" y="290" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#666">Reavaliar matching anterior (sem congelar habilitação)</text>
</svg>
