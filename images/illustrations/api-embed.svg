<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">API embutida no ERP</title>
  <desc id="desc">Diagrama abstrato: ERP parceiro recebe eventos da API LicitaFit</desc>
  <rect width="960" height="360" fill="#f7f7f7"/>
  <!-- ERP panel -->
  <rect x="48" y="48" width="380" height="264" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <rect x="48" y="48" width="380" height="40" rx="6" fill="#2c001e"/>
  <rect x="48" y="76" width="380" height="12" fill="#2c001e"/>
  <circle cx="72" cy="68" r="5" fill="#e95420"/>
  <circle cx="90" cy="68" r="5" fill="#f2c94c"/>
  <circle cx="108" cy="68" r="5" fill="#0e8420"/>
  <text x="128" y="73" font-family="Ubuntu, Segoe UI, sans-serif" font-size="13" fill="#fff">ERP / AFV do parceiro</text>
  <rect x="72" y="112" width="160" height="14" rx="2" fill="#e5e5e5"/>
  <rect x="72" y="140" width="332" height="48" rx="4" fill="#f7f7f7" stroke="#d9d9d9"/>
  <rect x="84" y="152" width="90" height="10" rx="2" fill="#0e8420" opacity="0.85"/>
  <rect x="184" y="152" width="70" height="10" rx="2" fill="#666" opacity="0.35"/>
  <rect x="264" y="152" width="110" height="10" rx="2" fill="#b76f00" opacity="0.55"/>
  <rect x="72" y="204" width="332" height="48" rx="4" fill="#f7f7f7" stroke="#d9d9d9"/>
  <rect x="84" y="216" width="120" height="10" rx="2" fill="#0e8420" opacity="0.85"/>
  <rect x="214" y="216" width="80" height="10" rx="2" fill="#666" opacity="0.35"/>
  <rect x="72" y="268" width="140" height="22" rx="3" fill="#0e8420"/>
  <text x="84" y="283" font-family="Ubuntu, Segoe UI, sans-serif" font-size="11" fill="#fff">Oportunidades</text>
  <!-- Arrow -->
  <path d="M448 180 H512" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
  <!-- API panel -->
  <rect x="532" y="72" width="380" height="216" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <rect x="532" y="72" width="380" height="36" fill="#111"/>
  <text x="552" y="95" font-family="Ubuntu, Segoe UI, sans-serif" font-size="13" fill="#fff">LicitaFit API</text>
  <rect x="556" y="132" width="220" height="16" rx="2" fill="#e5e5e5"/>
  <text x="564" y="144" font-family="ui-monospace, monospace" font-size="11" fill="#111">POST /v1/catalogs</text>
  <rect x="556" y="160" width="280" height="16" rx="2" fill="#e5e5e5"/>
  <text x="564" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#111">GET /v1/catalogs/{id}/opportunities</text>
  <rect x="556" y="188" width="240" height="16" rx="2" fill="#e5e5e5"/>
  <text x="564" y="200" font-family="ui-monospace, monospace" font-size="11" fill="#111">POST /v1/webhook-endpoints</text>
  <rect x="556" y="228" width="120" height="28" rx="3" fill="#24598f"/>
  <text x="576" y="246" font-family="Ubuntu, Segoe UI, sans-serif" font-size="12" fill="#fff">eventos</text>
</svg>
