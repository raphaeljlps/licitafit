# Interim static publish (optional). Canonical SEO stays https://www.licitafit.com.br
[build]
  publish = "."
  command = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/needs-review-matched-conflito-unknown/"
  to = "/status-matching/"
  status = 301
  force = true
